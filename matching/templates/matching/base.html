<!-- matching/templates/matching/base.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PRISMATA - AI Recruitment{% endblock %}</title>
    
    <!-- Memanggil Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi Tema Kustom (Opsional) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        secondary: '#4338ca', // Indigo 700
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- NAVIGATION BAR -->
    <nav class="bg-white shadow-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo & Menu Kiri -->
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center gap-2">
                        <span class="text-2xl">💠</span>
                        <span class="font-extrabold text-xl text-primary tracking-tight">PRISMATA</span>
                    </div>
                    <div class="hidden md:ml-8 md:flex md:space-x-2">
                        <a href="{% url 'matching:matching' %}" class="text-slate-600 hover:text-primary hover:bg-slate-50 px-3 py-2 rounded-md text-sm font-semibold transition">🎯 Skill Matching</a>
                        <a href="{% url 'matching:grading' %}" class="text-slate-600 hover:text-primary hover:bg-slate-50 px-3 py-2 rounded-md text-sm font-semibold transition">📝 Smart Grading</a>
                        <a href="{% url 'matching:sjt_kerjakan' %}" class="text-slate-600 hover:text-primary hover:bg-slate-50 px-3 py-2 rounded-md text-sm font-semibold transition">🧠 Ujian SJT</a>
                        <a href="{% url 'matching:history' %}" class="text-slate-600 hover:text-primary hover:bg-slate-50 px-3 py-2 rounded-md text-sm font-semibold transition">📋 Riwayat</a>
                    </div>
                </div>
                
                <!-- Menu Kanan (Admin & Action) -->
                <div class="flex items-center space-x-4">
                    <a href="{% url 'matching:sjt_soal_form' %}" class="text-slate-500 hover:text-primary text-sm font-medium">➕ Tambah Soal SJT</a>
                    <a href="/admin/" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-700 shadow-sm transition">⚙️ Panel Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- KONTEN UTAMA -->
    <main class="flex-grow w-full max-w-5xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        <!-- Area Pesan/Notifikasi -->
        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for msg in messages %}
                    <div class="p-4 rounded-lg text-sm font-medium 
                        {% if 'error' in msg.tags %} bg-red-100 text-red-700 border border-red-200
                        {% elif 'warning' in msg.tags %} bg-yellow-100 text-yellow-700 border border-yellow-200
                        {% else %} bg-emerald-100 text-emerald-700 border border-emerald-200 {% endif %}">
                        {{ msg }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Tempat menyisipkan konten dari file lain -->
        {% block content %}
        {% endblock content %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-500">
            &copy; 2026 PRISMATA - Program Studi Teknik Informatika
        </div>
    </footer>

</body>
</html>
